<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض العبارة النصية الاحترافية</title>
    
    <!-- مكتبة Tailwind CSS للتنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- خطوط جوجل العربية (Cairo & Tajawal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #090d16;
        }

        /* ----------------------------------------------------
           تأثير تدرج الألوان المتحرك على النص
           Animated Gradient Text Effect
        ---------------------------------------------------- */
        .gradient-text-animated {
            background: linear-gradient(
                135deg, 
                #a855f7 0%, 
                #ec4899 25%, 
                #3b82f6 50%, 
                #06b6d4 75%, 
                #a855f7 100%
            );
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 8s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ----------------------------------------------------
           تأثير الزجاج المضبب والحدود المضيئة (Glassmorphism)
        ---------------------------------------------------- */
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(168, 85, 247, 0.15);
        }

        /* ----------------------------------------------------
           تأثير الهالة الضوئية خلف البطاقة (Glow Blob)
        ---------------------------------------------------- */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            pointer-events: none;
            animation: orbPulse 6s ease-in-out infinite alternate;
        }

        @keyframes orbPulse {
            0% { transform: scale(0.9); opacity: 0.4; }
            100% { transform: scale(1.15); opacity: 0.7; }
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4 sm:p-8 relative overflow-hidden text-slate-100">

    <!-- خلفية الهالة الضوئية العلوية والسفلية -->
    <div class="glow-orb w-80 h-80 sm:w-96 sm:h-96 bg-purple-600 -top-10 -right-10"></div>
    <div class="glow-orb w-80 h-80 sm:w-96 sm:h-96 bg-cyan-600 -bottom-10 -left-10" style="animation-delay: 3s;"></div>

    <!-- البطاقة الرئيسية في منتصف الشاشة (تحتوي على العبارة فقط) -->
    <main class="w-full max-w-4xl glass-card rounded-3xl p-8 sm:p-16 text-center relative z-10 transition-all duration-300 hover:border-purple-500/40">
        
        <!-- ====================================================
             تنبيه: غير العبارة النصية الخاصة بك من هنا بسهولة!
             CHANGE YOUR QUOTE TEXT HERE
        ==================================================== -->
        <h1 class="text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-black leading-relaxed sm:leading-tight tracking-wide gradient-text-animated select-none">
            " مريم "
        </h1>
        <!-- ==================================================== -->

    </main>

</body>
</html>
